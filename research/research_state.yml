schema_version: 1
last_updated: 2026-09-03
active_branch: shawn_dev
workflow_mode: local_writing

project:
  short_name: HAP_CO2mineralization
  working_title: AI-Driven Multiscale Discovery of Apatite Surfaces for CO2 Mineralization
  manuscript: paper/manuscript.qmd
  bibliography: paper/references.bib
  evidence_ledger: literature/evidence.csv
  artifact_inventory: research/artifact_inventory.csv

research_question: >-
  Which apatite compositions and surface environments warrant high-fidelity
  investigation for interfacial CO2 mineralization, and what atomistic mechanisms
  control their behavior under hydration?

current_stage: research_integrity_baseline
current_decision: quarantine_legacy_results_until_provenance_and_quality_gates_pass

compute:
  default_backend: local_lightweight
  local_profile: workflow/profiles/local.yaml
  hpc:
    enabled: false
    profile_template: workflow/profiles/whu-hpc.example.yaml
    credentials_in_repository: forbidden

result_gates:
  candidate_screening: blocked_missing_results_and_manifest
  adsorption_ranking: blocked_pipeline_not_implemented
  geometry_optimization: blocked_incomplete_failed_or_unreviewed_runs
  aimd_dataset: blocked_insufficient_or_invalid_trajectories
  mlip_validation: blocked_missing_dataset_and_model
  enhanced_sampling: blocked_not_implemented

manuscript_evidence:
  eligible_computational_artifacts: 0
  legacy_artifacts_default: ineligible
  synthetic_fallback_data: forbidden

known_blockers:
  - eight tracked CP2K or XYZ files contain unresolved Git conflict markers
  - no candidate-generation or adsorption-ranking result set is present
  - existing AIMD trajectories are too short, incomplete, or unstable
  - legacy HAP112 postprocessing lacks raw inputs and reports poor quality
  - no populated MLIP dataset, validated model, scale-up run, or enhanced-sampling run is present
  - bibliography metadata and claim-specific locators require primary-source verification

next_actions:
  - review the artifact inventory and ineligibility decisions with the research team
  - resolve legacy conflict markers only after a separate scientific-input review
  - perform a focused HAP-surface and HAP-CO2 literature search when online research is authorized
  - define quantitative go/no-go gates before new compute
